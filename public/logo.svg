<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="SplitShip logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD6E8"/><stop offset=".5" stop-color="#E4D7FF"/><stop offset="1" stop-color="#C9F0FF"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9B8AFB"/><stop offset="1" stop-color="#7C6CE0"/>
    </linearGradient>
    <style>
      .float{animation:float 3s ease-in-out infinite;transform-origin:100px 110px}
      .wave{animation:wave 4s linear infinite}
      .w2{animation-duration:6s;opacity:.6}
      .box{animation:pop 3s ease-in-out infinite}
      .b2{animation-delay:.3s}.b3{animation-delay:.6s}
      @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
      @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-80px)}}
      @keyframes pop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    </style>
    <clipPath id="clip"><rect width="200" height="200" rx="44"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <g class="float">
      <rect class="box" x="62" y="70" width="24" height="22" rx="5" fill="#FFB5D2"/>
      <rect class="box b2" x="89" y="58" width="24" height="34" rx="5" fill="#B5E8FF"/>
      <rect class="box b3" x="116" y="74" width="24" height="18" rx="5" fill="#C8F5D2"/>
      <path d="M45 96 H155 L140 128 Q100 138 60 128 Z" fill="url(#hull)"/>
      <circle cx="80" cy="112" r="4" fill="#fff"/><circle cx="100" cy="114" r="4" fill="#fff"/><circle cx="120" cy="112" r="4" fill="#fff"/>
    </g>
    <path class="wave w2" d="M0 140 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V200 H0Z" fill="#B5E8FF"/>
    <path class="wave" d="M0 150 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V200 H0Z" fill="#9FD8F5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
