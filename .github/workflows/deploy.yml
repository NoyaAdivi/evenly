name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Push image to GHCR
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Wait for Railway deploy
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Wait until Railway serves the new version
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "::warning::APP_URL variable is missing, skipping the live check"
            exit 0
          fi
          # Railway deploys on its own after CI passes ("Wait for CI"), so here we only confirm it is live
          for i in $(seq 1 40); do
            if curl -fs "${{ vars.APP_URL }}/health" | grep -q "${{ github.sha }}"; then
              echo "Live version is ${{ github.sha }}"; exit 0
            fi
            sleep 15
          done
          echo "::warning::The new version did not report healthy in time"
