name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - name: Lint (syntax check)
        run: npm run lint
      - name: Unit + API tests with coverage
        run: npm test

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t evenly:ci .
      - name: Run container
        run: docker run -d --name evenly -p 3000:3000 evenly:ci
      - name: Smoke test /health
        run: |
          for i in $(seq 1 20); do
            if curl -fs http://localhost:3000/health; then echo; echo "healthy"; exit 0; fi
            sleep 1
          done
          docker logs evenly
          exit 1
      - name: Smoke test /api/split
        run: |
          curl -fs -X POST http://localhost:3000/api/split \
            -H 'content-type: application/json' \
            -d '{"total":100,"guests":[{"name":"Noya"},{"name":"Dana"}]}' | grep -q '"amount":50'
